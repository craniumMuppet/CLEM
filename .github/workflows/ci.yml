name: clem-v2.29.29-physics-r13-ci

on:
  push:
  pull_request:

jobs:
  release-consistency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.lock

      - name: Verify release identity
        run: python check_release_identity.py

      - name: Compile complete source tree
        run: python -m compileall -q .

      - name: Check CLI startup
        run: python climate_model.py --help

      - name: Run Coupled Low-complexity Earth Model 2.29.29 / Repair R13 release-consistency checks
        run: python verify_physics_local.py --worker-mode static

      - name: Run GUI launcher regression tests
        run: python -m pytest -q tests/test_v22917_gui_startup.py

      - name: Verify complete historical pytest suite still collects
        run: python -m pytest --collect-only -q
