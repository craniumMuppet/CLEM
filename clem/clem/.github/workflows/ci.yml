name: climate-model-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.lock

      - name: Compile source
        run: python -m compileall -q .

      - name: Run pytest regression tests
        run: python -m pytest -q

      - name: Run legacy regression suite
        run: python run_tests.py

      - name: Run Windows default startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from dataclasses import replace; from climate_model import ModelConfig, ProcessClimateModel; r=ProcessClimateModel(replace(ModelConfig(), scenario='constant', duration_years=0.1, record_every_years=0.1, auto_initialize_from_1850=False)).run(); assert len(r.dataframe) >= 1"

      - name: Run Windows Monte Carlo smoke test
        if: runner.os == 'Windows'
        run: python monte_carlo_smoke_test.py

      - name: Run graphical layout regression
        if: runner.os == 'Linux'
        run: xvfb-run -a python gui_layout_test.py
